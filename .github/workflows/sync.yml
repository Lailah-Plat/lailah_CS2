name: Sync to Org Repo

on:
  push:
    branches:
      - main
  workflow_dispatch: # يتيح لك تشغيل الـ Workflow يدويًا بنقرة زر

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Organization Repo
        env:
          PAT: ${{ secrets.lailah_CS2_sync }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add org-repo https://x-access-token:${PAT}@github.com/Lailah-Plat/lailah_CS2.git
          git push org-repo main --force
