name: Sync Repositories

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Organization Repo
        run: |
          git remote add destination "https://x-access-token:${{ secrets.LAILAH_CS2_SYNC }}@github.com/Lailah-Plat/lailah_CS2.git"
          git push destination main --force
